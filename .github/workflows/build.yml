name: Build

on:
  push:
    branches:
      - main
      - test
      - Rebuild
      - development
      - refactor/central-content-pipeline-v3
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.0'

      - name: Build PixelRPG
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify source API boundaries
        shell: bash
        run: |
          set -euo pipefail

          forbidden_legacy='org\.bukkit\.ChatColor|net\.md_5\.bungee\.api\.ChatColor|net\.minecraft\.server\.v[0-9_]+|org\.bukkit\.craftbukkit'
          if grep -RInE --include='*.java' "$forbidden_legacy" src/main/java; then
            echo 'Forbidden legacy API usage detected.'
            exit 1
          fi

          if grep -RInE --include='*.java' 'static[[:space:]]+(final[[:space:]]+)?[^;]*(Player|Entity|World)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*[;=]' src/main/java; then
            echo 'Static live Bukkit reference detected.'
            exit 1
          fi

          echo 'Gson is permitted internally and is verified through ShadowJar relocation below.'
          echo 'Source API boundary validation passed.'

      - name: Verify plugin artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact='build/libs/Pixel-RPG.jar'
          test -f "$artifact"
          jar tf "$artifact" | grep -q '^paper-plugin.yml$'
          jar tf "$artifact" | grep -q '^de/pixelrpg/rpg/'

          if jar tf "$artifact" | grep -qE '^(com/google/gson|com/zaxxer/hikari|com/mysql)/'; then
            echo 'Unrelocated bundled dependency package detected.'
            exit 1
          fi

          if ! jar tf "$artifact" | grep -q '^de/pixelrpg/rpg/libs/gson/'; then
            echo 'Relocated Gson package missing from shaded artifact.'
            exit 1
          fi
          if ! jar tf "$artifact" | grep -q '^de/pixelrpg/rpg/libs/hikari/'; then
            echo 'Relocated Hikari package missing from shaded artifact.'
            exit 1
          fi
          if ! jar tf "$artifact" | grep -q '^de/pixelrpg/rpg/libs/mysql/'; then
            echo 'Relocated MySQL package missing from shaded artifact.'
            exit 1
          fi

          if ! jar tf "$artifact" | grep -q '^META-INF/services/java.sql.Driver$'; then
            echo 'Shaded JDBC service descriptor missing.'
            exit 1
          fi

          echo 'PixelRPG artifact validation passed.'

      - name: Verify resource pack item models
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("resourcepack/assets/pixelrpg")
          items = root / "items"
          models = root / "models"
          textures = root / "textures"

          failures = []
          for item_file in sorted(items.rglob("*.json")):
              data = json.loads(item_file.read_text(encoding="utf-8"))
              model = data.get("model", {})
              model_path = model.get("model")
              if not model_path or not model_path.startswith("pixelrpg:"):
                  continue

              model_file = models / (model_path.removeprefix("pixelrpg:") + ".json")
              if not model_file.is_file():
                  failures.append(f"missing model: {item_file} -> {model_path}")
                  continue

              model_data = json.loads(model_file.read_text(encoding="utf-8"))
              for texture in model_data.get("textures", {}).values():
                  if not texture.startswith("pixelrpg:"):
                      continue
                  texture_file = textures / (texture.removeprefix("pixelrpg:") + ".png")
                  if not texture_file.is_file():
                      failures.append(f"missing texture: {model_file} -> {texture}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)

          print("Resource pack item-model references are internally consistent.")
          PY
