name: PixelRPG
version: 1.0.0
main: de.pixelrpg.rpg.PixelRPGPlugin
bootstrapper: de.pixelrpg.rpg.PixelRPGBootstrap
description: Core MMORPG framework plugin
author: PixelRPGTeam
api-version: '26.2'

permissions:
  rpg.admin:
    description: Allows administrative PixelRPG commands.
    default: op
  rpg.member:
