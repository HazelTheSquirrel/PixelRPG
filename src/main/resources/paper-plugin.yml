name: PixelRPG
version: 1.0.0
main: de.pixelrpg.rpg.PixelRPGPlugin
bootstrapper: de.pixelrpg.rpg.PixelRPGBootstrap
description: Core MMORPG framework plugin
author: PixelRPGTeam
api-version: '26.2'

commands:
  rpgadmin:
    description: PixelRPG administration commands
    permission: rpg.admin
  rpgparty:
    description: PixelRPG party commands
    permission: rpg.member
  questlog:
    description: Opens the PixelRPG quest log
    permission: rpg.member
  rpgcraft:
    description: Lists and crafts PixelRPG profession recipes
    permission: rpg.member
  dialogue:
    description: Opens the central PixelRPG native dialogue
    permission: rpg.member

permissions:
  rpg.admin:
    description: Allows access to PixelRPG administration commands
    default: op
  rpg.member:
    description: Allows access to PixelRPG player commands
    default: true
