season:
  id: "season-1"
  data-version: 1

# Player profiles use YAML in Season 1 by default. Set type to MYSQL only when the MySQL settings below are configured.
storage:
  type: "YAML"
  save-executor-threads: 4
  load-timeout-seconds: 8
  mysql:
    host: "localhost"
    port: 3306
    database: "pixelrpg"
    username: "root"
    password: "CHANGE_ME"
    pool-size: 20
    connection-timeout-ms: 8000
    ssl-mode: "REQUIRED"

items:
  soulbound:
    enabled: false
    cost: 200.0
    min-level: 30
  loot:
    item-drop-chance: 0.0
    currency-drop-chance: 0.20
    currency-drop-min-amount: 1
    currency-drop-max-amount: 8


crafting:
  npc-required-ranks:
    NPC_ADVANCED: JOURNEYMAN
    KINGDOM_ELITE: MASTER

profession-xp:
  gathering:
    farmer: 8
    fisherman: 12
    woodcutter: 8
    mountain-miner:
      default: 8
      common: 12
      valuable: 20
      rare: 35

economy:
  guild-territory:
    marker-base-price: 500.0
    marker-price-increase: 500.0
  bank:
    quick-amount: 10.0
  currency:
    max-stack-size: 99

combat:
  boss-max-hit-percent-of-max-hp: 0.12

story:
  chars-per-line: 18
  lines-per-page: 13

# mob-scaling.json is the primary tuning source. These YAML values are retained as the safe fallback if that JSON cannot be loaded.
mob-scaling:
  nameplate-duration-ticks: 120
  xp-per-max-health: 4.0
  damage-per-level: 0.15
  hp-per-level: 2.5
  player-parity-multiplier: 1.00

npc:
  look-radius: 5.0
  nameplate-radius: 5.0
  look-interval-ticks: 5

quests:
  party-share-range: 24.0

bosses:
  bar-radius: 60.0
  bar-update-interval-ticks: 20
  phase-check-interval-ticks: 10
  biome-spawn:
    spawn-radius: 80.0
    check-interval-seconds: 60
    spawn-chance-percent: 0.5
    max-concurrent: 3

statistics:
  autosave-interval-ticks: 6000

scoreboard:
  update-interval-ticks: 20

