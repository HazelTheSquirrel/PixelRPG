plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'de.pixelrpg'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    paperweight.paperDevBundle("26.2.build.121-stable")

    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'com.zaxxer:HikariCP:7.0.2'
    implementation 'com.mysql:mysql-connector-j:9.7.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
    options.compilerArgs.addAll(['-Xlint:all'])
}

tasks.register('verifyPixelRpgSourceBoundaries') {
    group = 'verification'
    description = 'Rejects legacy Bukkit/NMS APIs and static live-server references.'
    doLast {
        def sourceRoot = file('src/main/java')
        def forbidden = [
                ~/org\.bukkit\.ChatColor/,
                ~/net\.md_5\.bungee\.api\.ChatColor/,
                ~/net\.minecraft\.server\.v[0-9_]+/,
                ~/org\.bukkit\.craftbukkit/,
                ~/static\s+(?:final\s+)?(?:Player|Entity|World)\s+\w+\s*(?:=|;)/,
                ~/static\s+(?:final\s+)?[\w<>?, .]+\s+\w*(?:Player|Entity|World)\w*\s*(?:=|;)/
        ]
        fileTree(sourceRoot).matching { include '**/*.java' }.each { sourceFile ->
            def text = sourceFile.getText('UTF-8')
            forbidden.each { pattern ->
                if (pattern.matcher(text).find()) {
                    throw new GradleException("Forbidden API boundary in ${sourceFile}: ${pattern}")
                }
            }
        }
    }
}

tasks.shadowJar {
    archiveFileName = "Pixel-RPG.jar"
    relocate 'com.google.gson', 'de.pixelrpg.rpg.libs.gson'
    relocate 'com.zaxxer.hikari', 'de.pixelrpg.rpg.libs.hikari'
    relocate 'com.mysql', 'de.pixelrpg.rpg.libs.mysql'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.register('verifyPixelRpgShadedDependencies') {
    group = 'verification'
    description = 'Verifies that bundled third-party runtime classes are actually relocated.'
    dependsOn tasks.named('shadowJar')
    doLast {
        def jarFile = tasks.shadowJar.archiveFile.get().asFile
        if (!jarFile.isFile()) throw new GradleException("Shadow JAR not found: ${jarFile}")

        def forbiddenPrefixes = [
                'com/google/gson/',
                'com/zaxxer/hikari/',
                'com/mysql/'
        ]

        def classEntries = zipTree(jarFile).matching { include '**/*.class' }.files
        classEntries.each { entry ->
            def normalized = entry.path.replace('\\', '/')
            if (forbiddenPrefixes.any { prefix -> normalized.contains("/${prefix}") || normalized.startsWith(prefix) }) {
                throw new GradleException("Unrelocated third-party class in shadow JAR: ${normalized}")
            }
        }

        def serviceEntries = zipTree(jarFile).matching { include 'META-INF/services/java.sql.Driver' }.files
        if (serviceEntries.size() != 1) {
            throw new GradleException("Expected exactly one merged JDBC driver service descriptor, found ${serviceEntries.size()}")
        }

        def serviceFile = serviceEntries.iterator().next()
        def serviceText = serviceFile.getText('UTF-8').readLines()
                .collect { it.trim() }
                .findAll { !it.isEmpty() && !it.startsWith('#') }
        if (serviceText.isEmpty()) {
            throw new GradleException('Merged JDBC driver service descriptor is empty')
        }
        if (serviceText.any { it == 'com.mysql.cj.jdbc.Driver' }) {
            throw new GradleException('JDBC service descriptor still exposes the pre-relocation MySQL driver class')
        }
        if (!serviceText.any { it == 'de.pixelrpg.rpg.libs.mysql.cj.jdbc.Driver' }) {
            throw new GradleException('Relocated MySQL JDBC driver is missing from META-INF/services/java.sql.Driver')
        }
    }
}

tasks.register('verifyPixelRpgDialogueData') {
    group = 'verification'
    description = 'Validates data-driven dialogue trees and cross-references before packaging.'
    doLast {
        def parser = new groovy.json.JsonSlurper()
        def dialogueRoot = file('src/main/resources/dialogues')
        def loreFile = file('src/main/resources/data/lore.json')
        def loreEntries = parser.parse(loreFile)
        def loreIds = loreEntries.collect { it.id as String }.toSet()
        def trees = [:]
        fileTree(dialogueRoot).matching { include '**/*.json' }.files.sort().each { sourceFile ->
            def dialogueText = sourceFile.getText('UTF-8')
            def root = parser.parseText(dialogueText.replaceAll(/"next"\s*:\s*null/, '"next":""'))
            if (!(root instanceof Map)) throw new GradleException('Dialogue root must be an object: ' + sourceFile)
            def id = root.id as String
            def start = root.start as String
            def nodes = root.nodes
            if (!id || !start || !(nodes instanceof List)) throw new GradleException('Invalid dialogue definition: ' + sourceFile)
            if (trees.containsKey(id)) throw new GradleException('Duplicate dialogue tree id ' + id + ' in ' + sourceFile)
            def nodeIds = nodes.collect { it.id as String }
            if (nodeIds.any { !it }) throw new GradleException('Dialogue node without id: ' + sourceFile)
            if (nodeIds.toSet().size() != nodeIds.size()) throw new GradleException('Duplicate dialogue node id in ' + sourceFile)
            if (!nodeIds.contains(start)) throw new GradleException('Dialogue start node ' + start + ' does not exist in ' + sourceFile)
            nodes.each { node ->
                (node.options ?: []).each { option ->
                    def allowedOptionKeys = ['label', 'next', 'condition', 'action', 'completes'] as Set
                    def unknownOptionKeys = option.keySet().findAll { !allowedOptionKeys.contains(it.toString()) }
                    if (!unknownOptionKeys.isEmpty()) {
                        throw new GradleException('Unknown dialogue option field(s) in ' + sourceFile + ': ' + unknownOptionKeys)
                    }
                    def next = option.next
                    if (next != null && next.toString() && !nodeIds.contains(next.toString())) {
                        throw new GradleException('Dialogue option in ' + sourceFile + ' points to missing node ' + next)
                    }
                    def actionValues = option.action instanceof List ? option.action : [option.action ?: 'none']
                    actionValues.each { actionValue ->
                        def token = actionValue.toString().trim()
                        if (!token) throw new GradleException('Empty dialogue action in ' + sourceFile)
                        if (token.startsWith('lore:')) {
                            def loreId = token.substring('lore:'.length()).trim()
                            if (!loreIds.contains(loreId)) throw new GradleException('Dialogue ' + sourceFile + ' references unknown lore ' + loreId)
                        }
                        if (token.startsWith('world:') && token.substring('world:'.length()).trim().isEmpty()) throw new GradleException('Empty world-state reference in ' + sourceFile)
                        if (token.startsWith('quest:') && token.substring('quest:'.length()).trim().isEmpty()) throw new GradleException('Empty quest reference in ' + sourceFile)
                    }
                }
            }
            trees[id] = sourceFile
        }
        logger.lifecycle('Validated ' + trees.size() + ' dialogue trees and ' + loreIds.size() + ' lore ids.')
    }
}

tasks.check {
    dependsOn tasks.named('verifyPixelRpgDialogueData')
    dependsOn tasks.named('verifyPixelRpgSourceBoundaries')
    dependsOn tasks.named('verifyPixelRpgShadedDependencies')
}

tasks.jar {
    archiveClassifier.set('slim')
}

tasks.build {
    dependsOn tasks.shadowJar
}
